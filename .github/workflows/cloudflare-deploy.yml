name: CHEAP STOCK Cloudflare Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cheap-stock-cloudflare-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Prepare Cloudflare storage resources
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const databases = JSON.parse(execFileSync('npx', ['wrangler','d1','list','--json'], { encoding: 'utf8' }));
          const namespaces = JSON.parse(execFileSync('npx', ['wrangler','kv','namespace','list'], { encoding: 'utf8' }));
          const db = databases.find(x => (x.name || x.database_name) === 'cheap-stock-db');
          const kv = namespaces.find(x => x.title === 'cheap-stock-cache');
          const dbId = db && (db.uuid || db.database_id || db.id);
          if (dbId) config.d1_databases[0].database_id = dbId;
          if (kv && kv.id) config.kv_namespaces[0].id = kv.id;
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2));
          NODE
          if ! npx wrangler r2 bucket list | grep -Fq "cheap-stock-product-images"; then
            npx wrangler r2 bucket create cheap-stock-product-images
          fi
      - name: Deploy Cloudflare Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm run deploy
      - name: Apply Cloudflare D1 production migrations
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm run db:migrate:remote
      - name: Explain missing Cloudflare credentials
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
