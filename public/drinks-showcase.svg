<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">CHEAP STOCK drinks selection</title><desc id="desc">A colorful selection of bottled drinks, soda cans, juice cartons and water bottles with tropical fruit.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#073d51"/><stop offset=".55" stop-color="#087d8a"/><stop offset="1" stop-color="#b8e8cb"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="0"><stop stop-color="#ffffff" stop-opacity=".7"/><stop offset=".25" stop-color="#ffffff" stop-opacity=".08"/><stop offset=".7" stop-color="#ffffff" stop-opacity=".2"/><stop offset="1" stop-color="#092f36" stop-opacity=".25"/></linearGradient>
 <linearGradient id="gold" x2="1"><stop stop-color="#9d4a0a"/><stop offset=".45" stop-color="#f5bd43"/><stop offset="1" stop-color="#8d3b08"/></linearGradient>
 <linearGradient id="orange" x2="0" y2="1"><stop stop-color="#ffbd35"/><stop offset="1" stop-color="#f16b16"/></linearGradient>
 <linearGradient id="can" x2="1"><stop stop-color="#ffffff" stop-opacity=".28"/><stop offset=".18" stop-color="#ffffff" stop-opacity="0"/><stop offset=".8" stop-color="#ffffff" stop-opacity=".2"/><stop offset="1" stop-color="#061e29" stop-opacity=".25"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="15"/><feOffset dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/>
<circle cx="1330" cy="120" r="250" fill="#c8ffed" opacity=".12"/><circle cx="240" cy="160" r="190" fill="#b8ffdb" opacity=".1"/>
<g fill="none" stroke="#c5f5df" stroke-width="12" opacity=".25"><path d="M0 250Q210 80 420 250T840 250"/><path d="M1050 0q-80 140 60 220t-10 220"/></g>
<path d="M0 720Q300 650 600 735t600 0 400-10v175H0Z" fill="#073d45" opacity=".55"/>
<g filter="url(#shadow)">
<!-- beer bottles -->
