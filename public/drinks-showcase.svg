<g transform="translate(750 400)"><rect width="145" height="330" rx="27" fill="#1679d4" stroke="#0b4f98" stroke-width="8"/><ellipse cx="72" cy="13" rx="64" ry="10" fill="#d9e4e4"/><path d="M0 90h145v135H0Z" fill="#0e58a8"/><text x="72" y="165" font-family="Arial" font-size="26" font-weight="bold" text-anchor="middle" fill="#fff">COLA</text><path d="M5 20h135v290H5Z" fill="url(#can)"/></g>
<g transform="translate(930 455)"><rect width="135" height="275" rx="25" fill="#e8a51b" stroke="#a36a08" stroke-width="8"/><ellipse cx="67" cy="12" rx="58" ry="9" fill="#e6eeee"/><path d="M0 76h135v112H0Z" fill="#e97810"/><text x="67" y="143" font-family="Arial" font-size="25" font-weight="bold" text-anchor="middle" fill="#fff">ORANGE</text><path d="M5 20h125v235H5Z" fill="url(#can)"/></g>
