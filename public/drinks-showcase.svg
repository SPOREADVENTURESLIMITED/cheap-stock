<g transform="translate(1320 435) scale(.85)"><path d="M20 45 48 0h118l30 45v285H20Z" fill="#e84a65" stroke="#a92b49" stroke-width="8"/><path d="M48 0h118l30 45H20Z" fill="#ff9aa7"/><rect x="85" y="-15" width="42" height="25" rx="7" fill="#fff2cf"/><path d="M65 155q45-70 90 0-45 70-90 0Z" fill="#fff"/><text x="108" y="255" font-family="Arial" font-weight="bold" font-size="24" text-anchor="middle" fill="#fff">FRUIT</text></g>
