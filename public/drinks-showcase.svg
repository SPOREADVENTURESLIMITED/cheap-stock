<g transform="translate(390 270) scale(.88)"><path d="M72 0h46v55l18 25v365q0 35-34 35H57q-34 0-34-35V80l18-25V0Z" fill="#a65a18" stroke="#65350e" stroke-width="8"/><path d="M72 0h46v55H72Z" fill="#d8bd64"/><path d="M26 190h104v118H26Z" fill="#e9c45e"/><path d="M34 210h88v78H34Z" fill="#fff0bf"/><text x="78" y="258" font-family="Arial" font-weight="bold" font-size="24" text-anchor="middle" fill="#78431a">MALT</text><path d="M28 90h98v265H28Z" fill="url(#glass)"/></g>
<!-- soda cans -->
