<g fill="#e7fff5" opacity=".75"><circle cx="170" cy="115" r="8"/><circle cx="520" cy="145" r="6"/><circle cx="1030" cy="210" r="9"/><circle cx="1430" cy="330" r="7"/><circle cx="300" cy="540" r="5"/></g>
</svg>